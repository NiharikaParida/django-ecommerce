<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fashion Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/site.css?v=sticky-nav-3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="auth-page">
<div class="auth-panel">
    <div class="auth-card">
        <div class="side-panel">
            <h2>Login to your account</h2>
            <p>Enter your credentials to continue shopping with fast checkout, saved favourites, and personalized recommendations.</p>
            <a class="btn-primary" href="register.html">Create Account</a>
        </div>
        <div class="form-panel">
            <h2>Sign In</h2>
            <form class="auth-form" data-action="Login">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <input type="submit" class="btn-primary" value="Login">
                </div>
            </form>
        </div>
    </div>
</div>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
</body>
</html>
