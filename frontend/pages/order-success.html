<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Successful | Fashion Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/site.css?v=sticky-nav-3">
  <link rel="stylesheet" href="../assets/css/checkout-flow.css">
</head>
<body>
  <header class="navbar"><div class="logo">FASHION<span>.</span></div></header>
  <main class="success-page">
    <div class="success-icon">✓</div>
    <h1>Order Placed Successfully!</h1>
    <p>Your order has been placed successfully. We have saved the order details below.</p>
    <div class="success-details" id="successDetails"></div>
    <a class="place-order" href="../index.html">Continue Shopping</a>
  </main>
  <script>
    let order = null;
    try {
      order = JSON.parse(localStorage.getItem("fashionLastOrder") || "null");
    } catch (error) {
      order = null;
    }

    if (!order) {
      window.location.href = "cart.html";
    } else {
      const details = document.getElementById("successDetails");
      const addDetail = (label, value) => {
        const paragraph = document.createElement("p");
        const strong = document.createElement("strong");
        paragraph.append(`${label}: `);
        strong.textContent = value;
        paragraph.append(strong);
        details.append(paragraph);
      };
      const paymentMethod = order.payment_method === "online"
        ? `Online payment (${order.payment_status || "pending"})`
        : "Cash on Delivery";

      addDetail("Status", order.status || "Placed");
      addDetail("Order Number", `#${order.order_number || order.id}`);
      addDetail("Total Amount", `₹${Number(order.total || 0).toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      })}`);
      addDetail("Payment", paymentMethod);
    }
  </script>
  <script src="../assets/js/components.js"></script>
</body>
</html>
