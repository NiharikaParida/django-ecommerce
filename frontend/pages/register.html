<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Fashion Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-page">
<div class="auth-panel">
    <div class="auth-card">
        <div class="side-panel">
            <h2>Create your account</h2>
            <p>Register today for personalized deals, order tracking, and faster checkout across our fashion store.</p>
            <a class="btn-primary" href="login.html">Sign In</a>
        </div>
        <div class="form-panel">
            <h2>Create Account</h2>
            <form class="auth-form" id="register-form" data-action="Register">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email-register">Email address</label>
                    <input type="email" id="email-register" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password-register">Password</label>
                    <input type="password" id="password-register" name="password" placeholder="Choose a password" required autocomplete="new-password">
                    <div class="password-meter" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="password-checklist" id="password-checklist" aria-live="polite">
                        <p class="validation-item" data-rule="length">At least 8 characters</p>
                        <p class="validation-item" data-rule="digit">Contains at least one number</p>
                        <p class="validation-item" data-rule="uppercase">Contains an uppercase letter</p>
                        <p class="validation-item" data-rule="lowercase">Contains a lowercase letter</p>
                        <p class="validation-item" data-rule="special">Contains a special character</p>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter password" required autocomplete="new-password">
                    <p class="validation-message" id="confirm-message"></p>
                </div>
                <div class="form-group">
                    <input type="submit" class="btn-primary" value="Create Account">
                </div>
            </form>
        </div>
    </div>
</div>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/common.js"></script>
</body>
</html>
